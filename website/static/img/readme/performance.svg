<svg xmlns="http://www.w3.org/2000/svg" width="840" height="356" viewBox="0 0 840 356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Draining 20,000 empty jobs took Warp 2.1 seconds, Warp in single-worker mode 11.2 seconds and Hangfire 34.7 seconds. Draining 20,000 jobs that read and update a row took 5.3, 13.8 and 36.4 seconds."><rect x="0.5" y="0.5" width="839" height="355" rx="12" fill="#f6f5fb" stroke="#e4e2ee"/><text x="32" y="46" font-size="15" font-weight="600" fill="#14121f">Drain 20,000 empty jobs</text><text x="32" y="75" font-size="14" font-weight="600" fill="#14121f">Warp</text><rect x="190" y="60" width="536" height="20" rx="4" fill="#e6e4f0"/><rect x="190" y="60" width="32" height="20" rx="4" fill="#4E0EFF"/><text x="808" y="75" font-size="14" font-weight="600" text-anchor="end" fill="#14121f">2.1 s</text><text x="32" y="105" font-size="14" font-weight="400" fill="#5d5b73">Warp, single-worker</text><rect x="190" y="90" width="536" height="20" rx="4" fill="#e6e4f0"/><rect x="190" y="90" width="173" height="20" rx="4" fill="#a9a7bb"/><text x="808" y="105" font-size="14" font-weight="400" text-anchor="end" fill="#5d5b73">11.2 s</text><text x="32" y="135" font-size="14" font-weight="400" fill="#5d5b73">Hangfire</text><rect x="190" y="120" width="536" height="20" rx="4" fill="#e6e4f0"/><rect x="190" y="120" width="536" height="20" rx="4" fill="#a9a7bb"/><text x="808" y="135" font-size="14" font-weight="400" text-anchor="end" fill="#5d5b73">34.7 s</text><text x="32" y="190" font-size="15" font-weight="600" fill="#14121f">Drain 20,000 jobs that read and update a row</text><text x="32" y="219" font-size="14" font-weight="600" fill="#14121f">Warp</text><rect x="190" y="204" width="536" height="20" rx="4" fill="#e6e4f0"/><rect x="190" y="204" width="78" height="20" rx="4" fill="#4E0EFF"/><text x="808" y="219" font-size="14" font-weight="600" text-anchor="end" fill="#14121f">5.3 s</text><text x="32" y="249" font-size="14" font-weight="400" fill="#5d5b73">Warp, single-worker</text><rect x="190" y="234" width="536" height="20" rx="4" fill="#e6e4f0"/><rect x="190" y="234" width="203" height="20" rx="4" fill="#a9a7bb"/><text x="808" y="249" font-size="14" font-weight="400" text-anchor="end" fill="#5d5b73">13.8 s</text><text x="32" y="279" font-size="14" font-weight="400" fill="#5d5b73">Hangfire</text><rect x="190" y="264" width="536" height="20" rx="4" fill="#e6e4f0"/><rect x="190" y="264" width="536" height="20" rx="4" fill="#a9a7bb"/><text x="808" y="279" font-size="14" font-weight="400" text-anchor="end" fill="#5d5b73">36.4 s</text><text x="32" y="326" font-size="12" fill="#5d5b73">Shorter is better. Median of 3 runs, 1 server × 10 workers, same PostgreSQL server. Warp is in dispatcher mode, the 8.0 default.</text></svg>
