<svg xmlns="http://www.w3.org/2000/svg" width="840" height="296" viewBox="0 0 840 296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Warp drains 50,000 empty jobs in 7.2 to 10.6 seconds, Hangfire in 228 to 244. Warp drains 20,000 jobs that read and update a row in 14.0 to 17.7 seconds, Hangfire in 151 to 155."><rect x="0.5" y="0.5" width="839" height="295" rx="12" fill="#f6f5fb" stroke="#e4e2ee"/><text x="32" y="46" font-size="15" font-weight="600" fill="#14121f">Drain 50,000 empty jobs</text><text x="32" y="75" font-size="14" font-weight="600" fill="#14121f">Warp</text><rect x="124" y="60" width="570" height="20" rx="4" fill="#e6e4f0"/><rect x="124" y="60" width="25" height="20" rx="4" fill="#4E0EFF"/><text x="808" y="75" font-size="14" font-weight="600" text-anchor="end" fill="#14121f">7.2–10.6 s</text><text x="32" y="105" font-size="14" font-weight="400" fill="#5d5b73">Hangfire</text><rect x="124" y="90" width="570" height="20" rx="4" fill="#e6e4f0"/><rect x="124" y="90" width="570" height="20" rx="4" fill="#a9a7bb"/><text x="808" y="105" font-size="14" font-weight="400" text-anchor="end" fill="#5d5b73">228–244 s</text><text x="32" y="160" font-size="15" font-weight="600" fill="#14121f">Drain 20,000 jobs that read and update a row</text><text x="32" y="189" font-size="14" font-weight="600" fill="#14121f">Warp</text><rect x="124" y="174" width="570" height="20" rx="4" fill="#e6e4f0"/><rect x="124" y="174" width="65" height="20" rx="4" fill="#4E0EFF"/><text x="808" y="189" font-size="14" font-weight="600" text-anchor="end" fill="#14121f">14.0–17.7 s</text><text x="32" y="219" font-size="14" font-weight="400" fill="#5d5b73">Hangfire</text><rect x="124" y="204" width="570" height="20" rx="4" fill="#e6e4f0"/><rect x="124" y="204" width="570" height="20" rx="4" fill="#a9a7bb"/><text x="808" y="219" font-size="14" font-weight="400" text-anchor="end" fill="#5d5b73">151–155 s</text><text x="32" y="266" font-size="12" fill="#5d5b73">Shorter is better. Bars show the slowest run of each range. Same PostgreSQL server, Warp 8.0 (preliminary).</text></svg>
