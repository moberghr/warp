name: Release to NuGet

on:
  release:
    types: [published]

env:
  DOTNET_VERSION: '10.0'
  PACKAGE_VERSION: ${{ github.ref_name }}

jobs:
  publish:
    name: Pack and Publish
    # Never publish for a draft release. The `published` event can fire for a draft in some flows;
    # this guard guarantees packages reach NuGet only when the release is actually published.
    if: ${{ github.event.release.draft == false }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write  # Required for NuGet trusted publishing OIDC

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Install UI dependencies
      working-directory: src/ui
      run: npm ci

    # Pack Core first — UI and Worker depend on it
    - name: Pack Moberg.Warp.Core
      working-directory: src/core/Warp.Core
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    # Add local folder as NuGet source so UI/Worker can resolve Core during pack
    - name: Add local NuGet source
      run: dotnet nuget add source ${{ github.workspace }}/nupkgs --name local

    - name: Pack Moberg.Warp.UI
      working-directory: src/core/Warp.UI
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    - name: Pack Moberg.Warp.Worker
      working-directory: src/core/Warp.Worker
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    # Warp.Http depends only on Core. The Warp.Http.SourceGenerator project is referenced as
    # an analyzer and embedded into the package via PackagePath="analyzers/dotnet/cs/".
    - name: Pack Moberg.Warp.Http
      working-directory: src/core/Warp.Http
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    # Providers depend on both Core and Worker — pack after both are available on the local feed
    - name: Pack Moberg.Warp.Provider.PostgreSql
      working-directory: src/core/providers/Warp.Provider.PostgreSql
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    - name: Pack Moberg.Warp.Provider.SqlServer
      working-directory: src/core/providers/Warp.Provider.SqlServer
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    # Outbound adapter binding packages. Adapters.Http depends on Core; Adapters.Refit depends on
    # Adapters.Http, so pack Http first. (Webhook delivery is part of Core — no separate package.)
    - name: Pack Moberg.Warp.Adapters.Http
      working-directory: src/core/Warp.Adapters.Http
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    - name: Pack Moberg.Warp.Adapters.Refit
      working-directory: src/core/Warp.Adapters.Refit
      run: dotnet pack -c Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o ${{ github.workspace }}/nupkgs

    # Get short-lived API key via trusted publishing (OIDC, no stored secrets)
    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    # Push all packages to nuget.org
    - name: Push to NuGet
      run: dotnet nuget push "${{ github.workspace }}/nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
