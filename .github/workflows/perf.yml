name: Performance

# Compares THIS pull request against its merge base, both measured on the SAME runner in the SAME
# job, interleaved. Never against a stored historical number: that comparison measures the runners.
#
# What is gated and what is not is a measurement question, not a policy preference — see
# docs/plans/2026-09-22-performance-ci.md. Short version: counts are gated because they reproduce to
# a few percent; server-arm timings are reported because their measured spread reached 417%.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/benchmarks/**'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # BenchmarkDotNet, gating the two quantities that survive a shared runner: allocated bytes per
  # operation and database statements per job. Both are counts, and counts reproduce; the timings of
  # these same benchmarks have measured an Error of 108 s against a 25 s mean, so time is reported and
  # never gated.
  #
  # PostgreSQL is shared between the two runs and named in the environment rather than started per
  # process. That is not a convenience: BenchmarkDotNet runs benchmarks in a child process while
  # diagnosers run in the host, so a container the child creates cannot be reached by the diagnoser
  # that has to read pg_stat_statements from it.
  # ---------------------------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks (allocations + statements)
    runs-on: ubuntu-latest

    # Four benchmarks with parameter sweeps, each run twice (head and merge base), and one operation
    # drains ten thousand jobs. The concurrency arm is the slow one: a 5 ms handler under contention.
    timeout-minutes: 120
    env:
      WARP_BENCH_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start PostgreSQL
        run: |
          docker run -d --name warpbench -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=top

          for i in $(seq 1 30); do
            if docker exec warpbench pg_isready -U postgres > /dev/null 2>&1; then
              docker exec warpbench psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
              exit 0
            fi
            sleep 1
          done

          echo "::error::PostgreSQL did not become ready"
          docker logs warpbench
          exit 1

      - name: Run benchmarks on this PR
        run: |
          dotnet run -c Release --project src/benchmarks/Warp.ServerBenchmarks/Warp.ServerBenchmarks.csproj -- \
            --filter '*DispatcherModeBenchmark*' '*CompletionBatchBenchmark*' '*PayloadSizeBenchmark*' '*ConcurrencyBenchmark*' \
            --exporters json \
            --artifacts "${{ github.workspace }}/bench/head"

      - name: Run benchmarks against the merge base
        id: basebench
        continue-on-error: true
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          git checkout "$BASE" -- src/core
          dotnet run -c Release --project src/benchmarks/Warp.ServerBenchmarks/Warp.ServerBenchmarks.csproj -- \
            --filter '*DispatcherModeBenchmark*' '*CompletionBatchBenchmark*' '*PayloadSizeBenchmark*' '*ConcurrencyBenchmark*' \
            --exporters json \
            --artifacts "${{ github.workspace }}/bench/base"
          git checkout HEAD -- src/core

      - name: Compare
        if: steps.basebench.outcome == 'success'
        run: |
          dotnet run -c Release --project src/benchmarks/Warp.ServerBenchmarks/Warp.ServerBenchmarks.csproj -- \
            compare-bdn \
            --base="${{ github.workspace }}/bench/base" \
            --head="${{ github.workspace }}/bench/head" \
            --tolerance=2 \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Explain an incompatible base
        if: steps.basebench.outcome == 'failure'
        run: |
          echo "::warning::The benchmarks do not build against the merge base, so nothing was compared."
          echo "::warning::That happens when the PR adds an API the benchmark uses."

      - name: Fail on a multimodal distribution
        run: |
          # A multimodal benchmark means the median describes nothing. This is the check that would
          # have caught the bimodal claim plan found by hand during the 7.1.0 revalidation.
          if grep -rqi "multimodal" "${{ github.workspace }}/bench/head"; then
            echo "::error::BenchmarkDotNet reported a multimodal distribution - investigate before"
            echo "::error::reading any comparison from this run."
            grep -ri "multimodal" "${{ github.workspace }}/bench/head" || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: ${{ github.workspace }}/bench

  # ---------------------------------------------------------------------------------------------
  # The server arms — the tier that measures what the release notes actually claim.
  #
  # A microbenchmark job (BenchmarkDotNet, allocations compared across versions) was built and worked,
  # and is deliberately NOT here: it measured mediator-dispatch allocations, while every performance
  # claim this project publishes and every incident in its record is database-side. It also ran
  # BenchmarkDotNet twice per PR, which roughly doubled the wall time of this workflow to guard a
  # number that had not moved. The `compare-bdn` subcommand it used remains on the lab binary for
  # running by hand; `docs/plans/2026-09-22-performance-ci.md` records the reasoning.
  # ---------------------------------------------------------------------------------------------
  server-counters:
    name: Server counters (${{ matrix.arm.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm:
          - name: baseline
            args: --scenario=jobs --jobs=10000 --workers=16
          - name: mutex-8
            args: --scenario=mutex --keys=8 --handler-ms=5 --jobs=10000 --workers=16
          - name: dispatcher-4kb
            args: --scenario=jobs --jobs=10000 --workers=16 --dispatcher --payload=4096

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Started by hand rather than as a `services:` container, because the lab counts statements
      # through pg_stat_statements and that extension has to be loaded by the SERVER at startup
      # (`shared_preload_libraries`). A service container takes no command arguments, so there is no
      # way to ask for it there. This is also exactly how the lab README starts Postgres locally, so
      # CI and a developer's machine measure against the same configuration.
      - name: Start PostgreSQL
        run: |
          docker run -d --name warppg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=top

          for i in $(seq 1 30); do
            if docker exec warppg pg_isready -U postgres > /dev/null 2>&1; then
              echo "postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::PostgreSQL did not become ready"
          docker logs warppg
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (Warp.Dashboard npm build)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # The base build is TODAY's harness with the merge base's RUNTIME files. Building the lab from
      # the base commit itself would compare two different measuring instruments — during the 7.1.0
      # revalidation the 7.0.0 tag could not even run most arms, because the scenarios and --warmup
      # were added after it.
      - name: Build head lab
        run: |
          dotnet publish src/benchmarks/Warp.ServerBenchmarks/Warp.ServerBenchmarks.csproj \
            -c Release -o "$RUNNER_TEMP/lab-head"

      - name: Build base lab (merge-base runtime, current harness)
        id: basebuild
        continue-on-error: true
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git checkout "$BASE" -- src/core
          dotnet publish src/benchmarks/Warp.ServerBenchmarks/Warp.ServerBenchmarks.csproj \
            -c Release -o "$RUNNER_TEMP/lab-base"
          git checkout HEAD -- src/core

      # If the harness uses an API this PR introduced, the swap cannot compile. That is a legitimate
      # outcome, not a broken workflow — say so clearly instead of failing with a compiler error.
      - name: Explain an incompatible base
        if: steps.basebuild.outcome == 'failure'
        run: |
          echo "::warning::The current harness does not compile against the merge base's src/core,"
          echo "::warning::so no comparison is possible for this PR. This happens when the PR adds an"
          echo "::warning::API the benchmark uses. Compare against a published package version instead."
          echo "### Performance: comparison skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The benchmark harness does not compile against the merge base." >> "$GITHUB_STEP_SUMMARY"

      # Interleaved A/B/A/B, fresh database per run. Interleaving is what cancels drift within the
      # job — a noisy neighbour arriving mid-run biases a whole block of iterations rather than
      # scattering them, which is the one component averaging cannot remove.
      - name: Run interleaved arms
        if: steps.basebuild.outcome == 'success'
        env:
          CONN: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=warplab"
        run: |
          set -e
          reset_db () {
            docker exec warppg psql -U postgres -q \
              -c "DROP DATABASE IF EXISTS warplab" -c "CREATE DATABASE warplab"
          }
          for pass in 1 2; do
            for build in head base; do
              reset_db
              "$RUNNER_TEMP/lab-$build/Warp.ServerBenchmarks" load ${{ matrix.arm.args }} \
                --repeats=3 --warmup=1 \
                --json="$RUNNER_TEMP/${{ matrix.arm.name }}.$build.p$pass.json" \
                --connection="$CONN"
            done
          done

      - name: Compare
        if: steps.basebuild.outcome == 'success'
        run: |
          "$RUNNER_TEMP/lab-head/Warp.ServerBenchmarks" compare \
            --base="$RUNNER_TEMP/${{ matrix.arm.name }}.base.p2.json" \
            --head="$RUNNER_TEMP/${{ matrix.arm.name }}.head.p2.json" \
            --label="${{ matrix.arm.name }}" \
            --summary="$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-counters-${{ matrix.arm.name }}
          path: ${{ runner.temp }}/*.json
