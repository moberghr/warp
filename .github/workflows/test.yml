name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0'

jobs:
  ui-tests:
    name: UI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci

      - name: Run Vitest (with coverage gate)
        working-directory: src/ui
        run: npm test -- --coverage

  test:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            filter: --filter-trait "Category=PostgreSql"
          - database: SQL Server
            filter: --filter-trait "Category=SqlServer"
          - database: NoDb
            filter: --filter-trait "Category=NoDb"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (for Warp.Dashboard npm build)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci

      # Restore the whole solution, not just the test project: NuGetAuditMode=all reports vulnerable
      # transitive packages as NU1903, which TreatWarningsAsErrors turns into a restore failure. Restoring
      # only the test project left the 8 projects it doesn't reference (benchmarks, demo apps) unaudited,
      # so an advisory against one of their dependencies broke `dotnet build src/Warp.slnx` with CI green.
      # Costs a few seconds and no extra compilation — Build below still targets the test project.
      - name: Restore
        working-directory: src
        run: dotnet restore Warp.slnx

      - name: Build
        working-directory: src
        run: dotnet build tests/Warp.Tests/Warp.Tests.csproj --no-restore --configuration Debug

      - name: Test (${{ matrix.database }})
        working-directory: src
        run: |
          dotnet test --project tests/Warp.Tests/Warp.Tests.csproj --no-build --configuration Debug -- \
            ${{ matrix.filter }} \
            --report-trx --report-trx-filename test-results.trx \
            --results-directory "$GITHUB_WORKSPACE/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.database }}
          path: test-results/*.trx
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          check_name: ${{ matrix.database }} tests
          files: test-results/**/*.trx
          comment_mode: off
