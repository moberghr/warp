name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0'

jobs:
  ui-tests:
    name: UI unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci

      - name: Run Vitest (with coverage gate)
        working-directory: src/ui
        run: npm test -- --coverage

  test:
    name: ${{ matrix.database }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # One job per supported database version, each image pinned to an exact tag so a new upstream release
      # never changes what a run tested; NoDb once. The fixtures read the image from WARP_TEST_POSTGRES_IMAGE /
      # WARP_TEST_SQLSERVER_IMAGE (testing.md §4.3.1). Bump the tags deliberately.
      matrix:
        include:
          - database: PostgreSQL 17
            filter: --filter-trait "Category=PostgreSql"
            postgres_image: postgres:17.12
          - database: PostgreSQL 18
            filter: --filter-trait "Category=PostgreSql"
            postgres_image: postgres:18.7
          - database: SQL Server 2022
            filter: --filter-trait "Category=SqlServer"
            sqlserver_image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
          - database: SQL Server 2025
            filter: --filter-trait "Category=SqlServer"
            sqlserver_image: mcr.microsoft.com/mssql/server:2025-CU11-ubuntu-22.04
          - database: NoDb
            filter: --filter-trait "Category=NoDb"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (for Warp.Dashboard npm build)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/ui
        run: npm ci

      # Restore the whole solution, not just the test project: NuGetAuditMode=all reports vulnerable
      # transitive packages as NU1903, which TreatWarningsAsErrors turns into a restore failure. Restoring
      # only the test project left the 8 projects it doesn't reference (benchmarks, demo apps) unaudited,
      # so an advisory against one of their dependencies broke `dotnet build src/Warp.slnx` with CI green.
      # Costs a few seconds and no extra compilation — Build below still targets the test project.
      - name: Restore
        working-directory: src
        run: dotnet restore Warp.slnx

      - name: Build
        working-directory: src
        run: dotnet build tests/Warp.Tests/Warp.Tests.csproj --no-restore --configuration Debug

      - name: Test (${{ matrix.database }})
        working-directory: src
        env:
          WARP_TEST_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
          WARP_TEST_SQLSERVER_IMAGE: ${{ matrix.sqlserver_image }}
        run: |
          # An empty matrix value would reach the fixture as "", not as unset.
          [ -n "$WARP_TEST_POSTGRES_IMAGE" ] || unset WARP_TEST_POSTGRES_IMAGE
          [ -n "$WARP_TEST_SQLSERVER_IMAGE" ] || unset WARP_TEST_SQLSERVER_IMAGE
          dotnet test --project tests/Warp.Tests/Warp.Tests.csproj --no-build --configuration Debug -- \
            ${{ matrix.filter }} \
            --report-trx --report-trx-filename test-results.trx \
            --results-directory "$GITHUB_WORKSPACE/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.database }}
          path: test-results/*.trx
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          check_name: ${{ matrix.database }} tests
          files: test-results/**/*.trx
          comment_mode: off
